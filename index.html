        if (t.spent) continue;
        CTX.save();
        CTX.translate(t.x, t.y);
        CTX.strokeStyle = "#00f0ff";
        CTX.lineWidth = 2;
        CTX.beginPath(); CTX.arc(0, 0, 14, 0, Math.PI * 2); CTX.stroke();
        CTX.fillStyle = "rgba(0, 240, 255, 0.15)";
        CTX.beginPath(); CTX.arc(0, 0, 14, 0, Math.PI * 2); CTX.fill();
        CTX.restore();
        drawProgressRing(t.x, t.y, 22, t.holdProgress, "#00f0ff");

        if (localPlayer.isChanneling && localPlayer.channelPreviewKind === "turretPad" && localPlayer.channelPreviewRef === t) {
          const coneDeg = (ic.turret && ic.turret.visionConeDegrees) || 10;
          const coneHalf = (coneDeg * Math.PI / 180) / 2;
          const range = (ic.turret && ic.turret.range) || 340;
          const ang = localPlayer.angle;
          CTX.save();
          CTX.translate(t.x, t.y);
          CTX.fillStyle = "rgba(255, 204, 0, 0.18)";
          CTX.beginPath();
          CTX.moveTo(0, 0);
          CTX.arc(0, 0, range, ang - coneHalf, ang + coneHalf);
          CTX.closePath();
          CTX.fill();
          CTX.strokeStyle = "rgba(255, 204, 0, 0.6)";
          CTX.lineWidth = 1.5;
          CTX.stroke();
          CTX.restore();
        }
      }

      // Deployed turrets: body + fixed-facing barrel + vision cone tint + hp bar + muzzle flash
      for (const id in turrets) {
        const t = turrets[id];
        const coneDeg = (ic.turret && ic.turret.visionConeDegrees) || 10;
        const coneHalf = (coneDeg * Math.PI / 180) / 2;
        const range = (ic.turret && ic.turret.range) || 340;
        CTX.save();
        CTX.translate(t.x, t.y);
        CTX.fillStyle = "rgba(0, 240, 255, 0.06)";
        CTX.beginPath();
        CTX.moveTo(0, 0);
        CTX.arc(0, 0, range, t.angle - coneHalf, t.angle + coneHalf);
        CTX.closePath();
        CTX.fill();
        CTX.rotate(t.angle);
        CTX.fillStyle = "#1e3a5f";
        CTX.fillRect(0, -3, 22, 6);
        CTX.fillStyle = t.justFired ? "#ffffff" : "#334155";
        CTX.beginPath(); CTX.arc(0, 0, 13, 0, Math.PI * 2); CTX.fill();
        if (t.justFired) {
          CTX.fillStyle = "#ffe066";
          CTX.beginPath(); CTX.arc(24, 0, 5, 0, Math.PI * 2); CTX.fill();
        }
        CTX.restore();
        CTX.save();
        CTX.translate(t.x, t.y);
        CTX.fillStyle = "rgba(0,0,0,0.5)";
        CTX.fillRect(-16, -26, 32, 4);
        CTX.fillStyle = "#00f0ff";
        CTX.fillRect(-16, -26, (t.hp / (t.maxHp || 255)) * 32 || 0, 4);
        CTX.restore();
      }

      // Lure pads (not yet deployed): marker + progress ring
      for (const id in lurePads) {
        const l = lurePads[id];
        if (!l.available || l.spent) continue;
        CTX.save();
        CTX.translate(l.x, l.y);
        CTX.strokeStyle = "#ff66cc";
        CTX.lineWidth = 2;
        CTX.beginPath(); CTX.arc(0, 0, 14, 0, Math.PI * 2); CTX.stroke();
        CTX.fillStyle = "rgba(255, 102, 204, 0.15)";
        CTX.beginPath(); CTX.arc(0, 0, 14, 0, Math.PI * 2); CTX.fill();
        CTX.restore();
        drawProgressRing(l.x, l.y, 22, l.holdProgress, "#ff66cc");
      }

      // Active lures: beacon + gradiented low-opacity pull-radius circle
      const pullRadius = (ic.lure && ic.lure.pullRadius) || 500;
      for (const id in lures) {
        const l = lures[id];
        const ratio = l.lifeRatio !== undefined ? l.lifeRatio : (l.life / (l.maxLife || l.life || 1));
        const grad = CTX.createRadialGradient(l.x, l.y, 0, l.x, l.y, pullRadius);
        grad.addColorStop(0, `rgba(255, 102, 204, ${0.16 * ratio})`);
        grad.addColorStop(1, "rgba(255, 102, 204, 0)");
        CTX.fillStyle = grad;
        CTX.beginPath(); CTX.arc(l.x, l.y, pullRadius, 0, Math.PI * 2); CTX.fill();

        CTX.save();
        CTX.translate(l.x, l.y);
        const pulse = 1 + Math.sin(performance.now() / 180) * 0.15;
        CTX.fillStyle = "#ff66cc";
        CTX.beginPath(); CTX.arc(0, 0, 10 * pulse, 0, Math.PI * 2); CTX.fill();
        CTX.restore();
      }

      // Med stations: cross icon, dimmed once fully spent, progress ring while channeling
      for (const id in medStations) {
        const s = medStations[id];
        const spentForMe = !!s.usedBy[myId];
        CTX.save();
        CTX.translate(s.x, s.y);
        CTX.fillStyle = s.medicChargeUsed && spentForMe ? "rgba(51, 255, 102, 0.12)" : "rgba(51, 255, 102, 0.22)";
        CTX.beginPath(); CTX.arc(0, 0, 18, 0, Math.PI * 2); CTX.fill();
        CTX.strokeStyle = "#33ff66";
        CTX.lineWidth = 2;
        CTX.beginPath(); CTX.arc(0, 0, 18, 0, Math.PI * 2); CTX.stroke();
        CTX.fillStyle = "#33ff66";
        CTX.fillRect(-2, -9, 4, 18);
        CTX.fillRect(-9, -2, 18, 4);
        CTX.restore();
        drawProgressRing(s.x, s.y, 26, s.holdProgress, "#33ff66");
      }
    }

    function renderGame() {
      CTX.fillStyle = "#05070b";
      CTX.fillRect(0, 0, canvasW, canvasH);

      if (gameState !== "PLAYING") return;

      CTX.save();
      CTX.translate(canvasW / 2, canvasH / 2);
      CTX.scale(camera.zoom, camera.zoom);
      CTX.translate(-camera.x, -camera.y);

      // Arena floor + grid, drawn only across world bounds so panning is visible
      CTX.fillStyle = "#0b0e14";
      CTX.fillRect(0, 0, WORLD_W, WORLD_H);
      CTX.strokeStyle = "#121a28";
      CTX.lineWidth = 1;
      const grid = 40;
      for (let x = 0; x <= WORLD_W; x += grid) { CTX.beginPath(); CTX.moveTo(x, 0); CTX.lineTo(x, WORLD_H); CTX.stroke(); }
      for (let y = 0; y <= WORLD_H; y += grid) { CTX.beginPath(); CTX.moveTo(0, y); CTX.lineTo(WORLD_W, y); CTX.stroke(); }
      CTX.strokeStyle = "rgba(0, 240, 255, 0.35)";
      CTX.lineWidth = 3;
      CTX.strokeRect(0, 0, WORLD_W, WORLD_H);

      renderInteractables();

      if (!localPlayer.isDowned && !localPlayer.isDead) {
        CTX.strokeStyle = "rgba(0, 240, 255, 0.2)";
        CTX.beginPath();
        CTX.moveTo(localPlayer.x, localPlayer.y);
        CTX.lineTo(localPlayer.x + Math.cos(localPlayer.angle) * 600, localPlayer.y + Math.sin(localPlayer.angle) * 600);
        CTX.stroke();
      }

      // Poison trail patches on the ground, fading out as they age
      for (const id in poisonPatches) {
        const patch = poisonPatches[id];
        const ratio = patch.lifeRatio !== undefined ? patch.lifeRatio : (patch.life / (patch.maxLife || patch.life || 1));
        CTX.fillStyle = `rgba(70, 220, 90, ${0.15 + ratio * 0.35})`;
        CTX.beginPath();
        CTX.arc(patch.x, patch.y, patch.radius, 0, Math.PI * 2);
        CTX.fill();
      }

      CTX.fillStyle = "#ffea00";
      for (const b of bullets) { CTX.beginPath(); CTX.arc(b.x, b.y, 2.5, 0, Math.PI * 2); CTX.fill(); }

      for (const id in aliens) {
        const a = aliens[id];
        const armed = a.fuse !== undefined ? a.fuse >= 0 : !!a.armed;
        CTX.save();
        CTX.translate(a.x, a.y);

        if (a.type === 4) {
          // Hive: large pulsating organic mass
          const pulse = 1 + Math.sin(performance.now() / 260) * 0.06;
          CTX.fillStyle = "#3a0a4a";
          CTX.beginPath(); CTX.arc(0, 0, a.radius * pulse, 0, Math.PI * 2); CTX.fill();
          CTX.fillStyle = "#7a1fae";
          CTX.beginPath(); CTX.arc(0, 0, a.radius * pulse * 0.62, 0, Math.PI * 2); CTX.fill();
          CTX.fillStyle = "#c04dff";
          CTX.beginPath(); CTX.arc(0, 0, a.radius * pulse * 0.3, 0, Math.PI * 2); CTX.fill();
        } else if (a.type === 2 && armed) {
          // Boomer arming to detonate: fast white/red flash
          const flash = Math.floor(performance.now() / 80) % 2 === 0;
          CTX.fillStyle = flash ? "#ffffff" : "#ff3300";
          CTX.beginPath(); CTX.arc(0, 0, a.radius * 1.15, 0, Math.PI * 2); CTX.fill();
        } else {
          CTX.fillStyle = a.type === 1 ? "#a4165e" : a.type === 2 ? "#ff7a1a" : a.type === 3 ? "#2fcf5f" : "#ff2a5f";
          CTX.beginPath();
          CTX.arc(0, 0, a.radius, 0, Math.PI * 2);
          CTX.fill();
        }

        if (a.type !== 4) {
          CTX.fillStyle = "rgba(0,0,0,0.5)";
          CTX.fillRect(-a.radius, -a.radius - 6, a.radius * 2, 4);
          CTX.fillStyle = a.type === 1 ? "#ff6fae" : a.type === 2 ? "#ffcc99" : a.type === 3 ? "#a8ffbf" : "#ff3366";
          CTX.fillRect(-a.radius, -a.radius - 6, (a.hp / 255) * a.radius * 2 || 0, 4);
        } else {
          // Hive health bar, larger and above the pulsating mass
          CTX.fillStyle = "rgba(0,0,0,0.5)";
          CTX.fillRect(-40, -a.radius - 14, 80, 6);
          CTX.fillStyle = "#e6a8ff";
          CTX.fillRect(-40, -a.radius - 14, (a.hp / 255) * 80 || 0, 6);
        }
        CTX.restore();
      }

      for (const p of particles) { CTX.fillStyle = p.color; CTX.fillRect(p.x, p.y, 2, 2); }

      Object.values(players).forEach(p => {
        const cls = CLASSES[p.classKey] || CLASSES[CLASS_KEYS[0]];
        CTX.save();
        CTX.translate(p.x, p.y);
        CTX.globalAlpha = p.isDead ? 0.3 : 1;

        if (p.isDowned) {
          CTX.rotate(p.angle);
          CTX.fillStyle = "#7a1030";
          CTX.beginPath();
          CTX.ellipse(0, 0, 16, 9, 0, 0, Math.PI * 2);
          CTX.fill();
          CTX.restore();
          if (p.reviveProgress > 0) {
            CTX.save();
            CTX.translate(p.x, p.y);
            CTX.strokeStyle = "#33ff66";
            CTX.lineWidth = 3;
            CTX.beginPath();
            CTX.arc(0, 0, 20, -Math.PI / 2, -Math.PI / 2 + (p.reviveProgress / REVIVE_NEEDED) * Math.PI * 2);
            CTX.stroke();
            CTX.restore();
          }
        } else {
          CTX.rotate(p.angle);
          CTX.fillStyle = "#475569";
          CTX.fillRect(6, 2, 12, 4);
          CTX.fillStyle = cls.color;
          CTX.beginPath();
          CTX.arc(0, 0, 14, 0, Math.PI * 2);
          CTX.fill();
          CTX.fillStyle = "#ffffff";
          CTX.beginPath();
          CTX.arc(8, 0, 3, 0, Math.PI * 2);
          CTX.fill();
          CTX.restore();
        }

        CTX.fillStyle = p.isDead ? "#475569" : "#94a3b8";
        CTX.font = "10px monospace";
        CTX.textAlign = "center";
        CTX.fillText(p.name, p.x, p.y - (p.isDowned ? 26 : 20));
      });

      CTX.restore();
    }

    // --- Init ---
    function initRealtime() {
      const status = document.getElementById("status-line");
      if (typeof window.webxdc.joinRealtimeChannel !== "function") {
        status.textContent = "Realtime not available – single player only";
        return;
      }
      try {
        realtimeChannel = window.webxdc.joinRealtimeChannel();
        realtimeChannel.setListener(handleRealtimeData);
      } catch (e) {
        status.textContent = "Could not join realtime channel";
        console.warn(e);
      }
    }

    function initDurable() {
      try {
        window.webxdc.setUpdateListener(onDurableUpdate, 0);
      } catch (e) {}
      announcePresence();
    }

    renderClassSelector();
    renderDifficultySelector();
    updatePeerListUI();
    initRealtime();
    initDurable();
    setupTouch();
    loadBundledConfig(); // non-blocking: game is already fully playable on DEFAULT_CONFIG

    function loop(now) {
      if (gameState === "PLAYING") updateGame(now);
      renderGame();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
