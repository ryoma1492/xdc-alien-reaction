name: Package WebXDC

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

# REQUIRED: Grants permission to create releases and attach assets
permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate manifest and JSON files
        shell: python
        run: |
          import json
          import tomllib
          from pathlib import Path

          root = Path.cwd()
          tomllib.loads((root / "manifest.toml").read_text(encoding="utf-8"))

          for path in sorted(root.glob("*.json")):
              json.loads(path.read_text(encoding="utf-8"))

      - name: Validate HTML
        run: npx --yes htmlhint@latest index.html

      - name: Build .xdc package
        id: build
        shell: python
        run: |
          import os
          import re
          import tomllib
          import zipfile
          from pathlib import Path

          root = Path.cwd()
          manifest = tomllib.loads((root / "manifest.toml").read_text(encoding="utf-8"))
          webxdc = manifest["webxdc"]
          package_name = re.sub(r"[^A-Za-z0-9._-]+", "", webxdc["name"])
          version = webxdc["version"]
          output_dir = root / "dist"
          output_dir.mkdir(exist_ok=True)
          output_path = output_dir / f"{package_name}-{version}.xdc"

          excluded_roots = {".git", ".github", "dist"}
          excluded_files = {"LICENSE", "README.md"}

          # ZIP_STORED packs files instantly without extra compression
          with zipfile.ZipFile(output_path, "w", compression=zipfile.ZIP_STORED) as archive:
              for path in sorted(root.rglob("*")):
                  relative_path = path.relative_to(root)
                  if (
                      path.is_dir()
                      or relative_path.parts[0] in excluded_roots
                      or relative_path.as_posix() in excluded_files
                  ):
                      continue
                  archive.write(path, relative_path.as_posix())

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output_file:
              output_file.write(f"package={output_path.name}\n")

      # REPLACED upload-artifact WITH THIS:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'nightly' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'Nightly Build' }}
          prerelease: ${{ github.ref_type != 'tag' }}
          files: dist/${{ steps.build.outputs.package }}