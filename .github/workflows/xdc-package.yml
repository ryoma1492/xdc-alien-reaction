name: Package WebXDC

on:
  workflow_dispatch:
  push:
    branches:
      - main
    # Notice: 'tags:' is deliberately omitted here so tag pushes never trigger this workflow

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate manifest and JSON files
        shell: python
        run: |
          import json
          import tomllib
          from pathlib import Path

          root = Path.cwd()
          tomllib.loads((root / "manifest.toml").read_text(encoding="utf-8"))

          for path in sorted(root.glob("*.json")):
              json.loads(path.read_text(encoding="utf-8"))

      - name: Validate HTML
        run: npx --yes htmlhint@latest index.html

      - name: Bump patch version in manifest.toml
        id: bump
        shell: python
        run: |
          import re
          import os
          from pathlib import Path

          manifest_path = Path("manifest.toml")
          content = manifest_path.read_text(encoding="utf-8")

          match = re.search(r'version\s*=\s*"(\d+)\.(\d+)\.(\d+)"', content)
          if not match:
              raise ValueError("Could not find semver string in manifest.toml")

          major, minor, patch = match.groups()
          new_patch = int(patch) + 1
          new_version = f"{major}.{minor}.{new_patch}"

          new_content = re.sub(
              r'version\s*=\s*"\d+\.\d+\.\d+"',
              f'version = "{new_version}"',
              content,
              count=1
          )
          manifest_path.write_text(new_content, encoding="utf-8")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"version={new_version}\n")
              f.write(f"tag=v{new_version}\n")

      - name: Commit and push bumped version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          NEW_TAG="${{ steps.bump.outputs.tag }}"
          
          git add manifest.toml
          # [skip ci] prevents the branch push from triggering a workflow loop
          git commit -m "chore(release): bump version to ${{ steps.bump.outputs.version }} [skip ci]"
          git tag -a "$NEW_TAG" -m "Release $NEW_TAG [skip ci]"
          
          git push origin main
          git push origin "$NEW_TAG"

      - name: Build .xdc package
        id: build
        shell: python
        run: |
          import os
          import re
          import tomllib
          import zipfile
          from pathlib import Path

          root = Path.cwd()
          manifest = tomllib.loads((root / "manifest.toml").read_text(encoding="utf-8"))
          webxdc = manifest["webxdc"]
          package_name = re.sub(r"[^A-Za-z0-9._-]+", "", webxdc["name"])
          version = webxdc["version"]
          output_dir = root / "dist"
          output_dir.mkdir(exist_ok=True)
          output_path = output_dir / f"{package_name}-{version}.xdc"

          excluded_roots = {".git", ".github", "dist"}
          excluded_files = {"LICENSE", "README.md"}

          with zipfile.ZipFile(output_path, "w", compression=zipfile.ZIP_STORED) as archive:
              for path in sorted(root.rglob("*")):
                  relative_path = path.relative_to(root)
                  if (
                      path.is_dir()
                      or relative_path.parts[0] in excluded_roots
                      or relative_path.as_posix() in excluded_files
                  ):
                      continue
                  archive.write(path, relative_path.as_posix())

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output_file:
              output_file.write(f"package={output_path.name}\n")

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: ${{ steps.bump.outputs.tag }}
          prerelease: false
          files: dist/${{ steps.build.outputs.package }}